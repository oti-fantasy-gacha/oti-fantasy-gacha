<meta charset="UTF-8">

<title>oti-fantasy ガチャシミュレーター</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold:#d4a843;--gold-light:#f0c96a;--gold-dark:#8a6a1a;
  --bg:#0a0812;--bg2:#110e1e;--text:#e8dfc8;--text-dim:#8a7f6a;
  --N:#9da8b0;--HN:#b8c4cc;--R:#4a9eff;--SR:#c060ff;--UR:#ff8c00;--SC:#ff3060;--SP:#ff69b4;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;
  background-image:radial-gradient(ellipse at 20% 20%,rgba(100,60,180,.15) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(212,168,67,.08) 0%,transparent 50%);}

/* ===== PARTICLES ===== */
#particles{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden;}
.particle{position:absolute;animation:particleFly var(--dur,1.5s) ease-out forwards;}
@keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0deg)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0) rotate(360deg)}}

/* ===== REVEAL STAGE ===== */
#reveal-stage{display:none;position:fixed;inset:0;z-index:200;cursor:pointer;overflow:hidden;}
#reveal-stage.show{display:block;}

/* 暗転背景 */
#reveal-bg{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .4s;}
#reveal-stage.show #reveal-bg{opacity:1;}

/* R用: 青い光柱 */
#light-beam-R{position:absolute;left:50%;top:0;width:3px;height:0;background:linear-gradient(to bottom,transparent,#4a9eff,#fff,#4a9eff,transparent);transform:translateX(-50%);opacity:0;filter:blur(2px);border-radius:4px;}
#light-beam-R.active{animation:beamDown .6s ease forwards;}
@keyframes beamDown{0%{height:0;opacity:0;top:0}60%{height:100vh;opacity:1}100%{height:100vh;opacity:.4}}

/* R用: 横の光線 */
#light-cross{position:absolute;top:50%;left:0;width:0;height:2px;background:linear-gradient(to right,transparent,#4a9eff,#fff,#4a9eff,transparent);transform:translateY(-50%);opacity:0;}
#light-cross.active{animation:crossExpand .4s ease .5s forwards;}
@keyframes crossExpand{0%{width:0;left:50%;opacity:0}100%{width:100%;left:0;opacity:.6}}

/* SR用: 金色オーラ */
#sr-aura{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,rgba(192,96,255,.6) 0%,rgba(212,168,67,.3) 40%,transparent 70%);}
#sr-aura.active{animation:auraGlow 1.2s ease forwards;}
@keyframes auraGlow{0%{opacity:0}40%{opacity:1}100%{opacity:.5}}

/* SR用: 光の柱（複数） */
.sr-beam{position:absolute;top:0;width:2px;height:0;opacity:0;filter:blur(1px);}
.sr-beam.active{animation:srBeamDown 1s ease forwards;}
@keyframes srBeamDown{0%{height:0;opacity:0}50%{opacity:1}100%{height:100vh;opacity:.5}}

/* カード表示エリア */
#reveal-card-area{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;}
#reveal-card-area.show-card{animation:cardAppear .5s ease forwards;}
@keyframes cardAppear{from{opacity:0;transform:scale(.5) translateY(40px)}to{opacity:1;transform:scale(1) translateY(0)}}
#reveal-img{width:min(260px,65vw);border-radius:10px;display:block;box-shadow:0 0 40px var(--card-glow,#fff);}
#reveal-icon-big{font-size:5rem;display:none;text-align:center;}
#reveal-rarity-text{font-family:'Cinzel',serif;font-size:2rem;font-weight:900;margin-top:18px;letter-spacing:.25em;text-shadow:0 0 30px currentColor;opacity:0;}
#reveal-rarity-text.show-text{animation:textAppear .4s ease .3s forwards;}
@keyframes textAppear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#reveal-name-text{font-size:.95rem;margin-top:8px;color:var(--text);opacity:0;}
#reveal-name-text.show-text{animation:textAppear .4s ease .5s forwards;}
#reveal-tap-hint{font-size:.7rem;color:rgba(255,255,255,.3);margin-top:28px;letter-spacing:.12em;opacity:0;}
#reveal-tap-hint.show-text{animation:textAppear .4s ease .7s forwards;}

/* ===== HEADER ===== */
header{text-align:center;padding:40px 20px 20px;border-bottom:1px solid rgba(212,168,67,.2);}
header h1{font-family:'Cinzel',serif;font-size:clamp(1.4rem,4vw,2.2rem);color:var(--gold);letter-spacing:.15em;text-shadow:0 0 30px rgba(212,168,67,.4);}
header p{color:var(--text-dim);font-size:.85rem;margin-top:6px;}
#rare-history-wrap{max-width:900px;margin:20px auto 0;padding:0 16px;}
#rare-history-label{font-size:.72rem;color:var(--gold-dark);letter-spacing:.1em;margin-bottom:6px;font-family:'Cinzel',serif;}
#rare-history{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;min-height:36px;scrollbar-width:thin;scrollbar-color:var(--gold-dark) transparent;}
.hist-chip{flex-shrink:0;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;border:1px solid currentColor;white-space:nowrap;}
main{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
.gacha-buttons{display:flex;gap:16px;justify-content:center;margin-bottom:32px;flex-wrap:wrap;}
.btn-gacha{font-family:'Cinzel',serif;font-size:1rem;letter-spacing:.12em;padding:14px 36px;border:2px solid var(--gold);background:linear-gradient(135deg,rgba(212,168,67,.15),rgba(212,168,67,.05));color:var(--gold-light);cursor:pointer;border-radius:4px;position:relative;overflow:hidden;transition:all .25s ease;}
.btn-gacha::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(212,168,67,.3),transparent);opacity:0;transition:opacity .25s;}
.btn-gacha:hover::before{opacity:1;}
.btn-gacha:hover{box-shadow:0 0 24px rgba(212,168,67,.35);transform:translateY(-1px);}
.btn-gacha:disabled{opacity:.4;cursor:not-allowed;transform:none;}
#result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
.card{border-radius:8px;position:relative;background:var(--bg2);border:2px solid rgba(255,255,255,.08);overflow:hidden;transition:transform .2s;opacity:0;}
.card.visible{animation:cardIn .35s ease forwards;}
.card:hover{transform:translateY(-4px);}
.card img{width:100%;display:block;}
.card-no-image{width:100%;aspect-ratio:5/7;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 8px;text-align:center;}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.card.rarity-SR,.card.rarity-UR{animation:cardIn .35s ease forwards,glowSR 2s ease-in-out infinite alternate;}
.card.rarity-R{animation:cardIn .35s ease forwards,glowR 2s ease-in-out infinite alternate;}
@keyframes glowSR{from{box-shadow:0 0 10px var(--glow-color)}to{box-shadow:0 0 25px var(--glow-color),0 0 50px var(--glow-color)}}
@keyframes glowR{from{box-shadow:0 0 6px rgba(74,158,255,.3)}to{box-shadow:0 0 18px rgba(74,158,255,.6)}}
.card.rarity-N {border-color:var(--N);}
.card.rarity-HN{border-color:var(--HN);}
.card.rarity-R {border-color:var(--R);  --glow-color:rgba(74,158,255,.5);}
.card.rarity-SR{border-color:var(--SR);--glow-color:rgba(192,96,255,.6);border-width:3px;}
.card.rarity-UR{border-color:var(--UR);--glow-color:rgba(255,140,0,.6);border-width:3px;}
.card-label{padding:6px 8px;font-size:.7rem;line-height:1.3;background:rgba(0,0,0,.65);}
.card-rarity-tag{font-family:'Cinzel',serif;font-size:.6rem;font-weight:700;}
.card-name-text{font-weight:700;margin-top:2px;}
.card-icon{font-size:2.2rem;margin-bottom:8px;}
#stats-wrap{margin-top:28px;padding:18px 20px;background:var(--bg2);border:1px solid rgba(212,168,67,.15);border-radius:8px;}
#stats-title{font-family:'Cinzel',serif;font-size:.78rem;color:var(--gold);letter-spacing:.1em;margin-bottom:12px;}
.stat-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.stat-label{width:36px;text-align:right;font-family:'Cinzel',serif;font-size:.68rem;}
.stat-bar-wrap{flex:1;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
.stat-bar{height:100%;border-radius:3px;transition:width .5s ease;}
.stat-count{width:40px;text-align:right;color:var(--text-dim);font-size:.75rem;}
#rate-toggle{display:block;margin:20px auto 0;background:none;border:1px solid rgba(212,168,67,.25);color:var(--text-dim);font-size:.75rem;padding:7px 20px;border-radius:4px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all .2s;}
#rate-toggle:hover{border-color:var(--gold);color:var(--gold);}
#rate-table{display:none;margin-top:16px;}
#rate-table.show{display:block;}
table{width:100%;border-collapse:collapse;font-size:.78rem;}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.05);}
th{color:var(--text-dim);font-weight:400;font-size:.7rem;}
#btn-reset{display:block;margin:16px auto 0;background:none;border:1px solid rgba(255,255,255,.1);color:var(--text-dim);font-size:.72rem;padding:6px 18px;border-radius:4px;cursor:pointer;transition:all .2s;}
#btn-reset:hover{border-color:rgba(255,80,80,.4);color:#ff8080;}
.c-N{color:var(--N)}.c-HN{color:var(--HN)}.c-R{color:var(--R)}.c-SR{color:var(--SR)}.c-UR{color:var(--UR)}.c-SC{color:var(--SC)}.c-SP{color:var(--SP)}
.bar-N{background:var(--N)}.bar-HN{background:var(--HN)}.bar-R{background:var(--R)}.bar-SR{background:var(--SR)}.bar-UR{background:var(--UR)}.bar-SC{background:var(--SC)}.bar-SP{background:var(--SP)}
@media(max-width:500px){#result-grid{grid-template-columns:repeat(3,1fr);gap:8px}}
</style>
</head>

];

const RATES=[
  {rarity:'SR',rate:.018},{rarity:'R',rate:.07},{rarity:'HN',rate:.32},{rarity:'N',rate:.59}
];

// ===== AUDIO =====
function getAudio(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playN(){
  try{
    const ctx=getAudio(),t=ctx.currentTime;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.setValueAtTime(330,t);
    o.frequency.exponentialRampToValueAtTime(495,t+.1);
    g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);
    o.start(t);o.stop(t+.2);
  }catch(e){}
}

function playHN(){
  try{
    const ctx=getAudio(),t=ctx.currentTime;
    [330,440,550].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*.04);
      g.gain.linearRampToValueAtTime(.1,t+i*.04+.03);
      g.gain.exponentialRampToValueAtTime(.001,t+i*.04+.25);
      o.start(t+i*.04);o.stop(t+i*.04+.25);
    });
  }catch(e){}
}

function playR(){
  try{
    const ctx=getAudio(),t=ctx.currentTime;
    // 暗い低音→明るいチャイム
    const bass=ctx.createOscillator(),bg=ctx.createGain();
    bass.connect(bg);bg.connect(ctx.destination);
    bass.type='sine';bass.frequency.value=110;
    bg.gain.setValueAtTime(.3,t);bg.gain.exponentialRampToValueAtTime(.001,t+.8);
    bass.start(t);bass.stop(t+.8);

    [523,659,784,1047].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+.3+i*.1);
      g.gain.linearRampToValueAtTime(.2,t+.3+i*.1+.05);
      g.gain.exponentialRampToValueAtTime(.001,t+.3+i*.1+.6);
      o.start(t+.3+i*.1);o.stop(t+.3+i*.1+.6);
    });
  }catch(e){}
}

function playSR(){
  try{
    const ctx=getAudio(),t=ctx.currentTime;
    // 重厚な低音ドラム
    [1,2,3].forEach(i=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.setValueAtTime(80,t+i*.15);
      o.frequency.exponentialRampToValueAtTime(40,t+i*.15+.15);
      g.gain.setValueAtTime(.4,t+i*.15);
      g.gain.exponentialRampToValueAtTime(.001,t+i*.15+.2);
      o.start(t+i*.15);o.stop(t+i*.15+.2);
    });
    // 輝くファンファーレ
    const fanfare=[261,329,392,261,329,392,523,659,784,1047];
    const timing=[0,.05,.1,.3,.35,.4,.6,.7,.8,.9];
    fanfare.forEach((f,i)=>{
      ['triangle','sine'].forEach(type=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type=type;o.frequency.value=f;
        const vol=type==='triangle'?.22:.12;
        g.gain.setValueAtTime(0,t+timing[i]);
        g.gain.linearRampToValueAtTime(vol,t+timing[i]+.05);
        g.gain.exponentialRampToValueAtTime(.001,t+timing[i]+.6);
        o.start(t+timing[i]);o.stop(t+timing[i]+.6);
      });
    });
  }catch(e){}
}

// ===== PARTICLES =====
function spawnParticles(color,count,shapes){
  const container=document.getElementById('particles');
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='particle';
    const size=Math.random()*12+4;
    const tx=(Math.random()-.5)*window.innerWidth*.9;
    const ty=-(Math.random()*window.innerHeight*.85+60);
    const dur=Math.random()*1+.8;
    const isSquare=shapes&&Math.random()>.5;
    p.style.cssText=`
      width:${size}px;height:${size}px;
      background:${color};
      border-radius:${isSquare?'2px':'50%'};
      left:${20+Math.random()*60}%;
      top:55%;
      --tx:${tx}px;--ty:${ty}px;--dur:${dur}s;
    `;
    container.appendChild(p);
    setTimeout(()=>p.remove(),(dur+.2)*1000);
  }
}

// ===== REVEAL =====
function wait(ms){return new Promise(r=>setTimeout(r,ms));}

function resetBeams(){
  document.getElementById('light-beam-R').className='';
  document.getElementById('light-cross').className='';
  document.getElementById('sr-aura').className='';
  ['srb1','srb2','srb3','srb4'].forEach(id=>{
    document.getElementById(id).className='sr-beam';
    document.getElementById(id).style.height='0';
  });
  const area=document.getElementById('reveal-card-area');
  area.className='';area.style.opacity='0';
  document.getElementById('reveal-rarity-text').className='';
  document.getElementById('reveal-name-text').className='';
  document.getElementById('reveal-tap-hint').className='';
}

async function showRevealR(card){
  return new Promise(async resolve=>{
    revealResolve=resolve;
    resetBeams();
    const stage=document.getElementById('reveal-stage');
    stage.classList.add('show');

    // 画像セット
    const img=document.getElementById('reveal-img');
    const icon=document.getElementById('reveal-icon-big');
    if(card.file){img.src=IMG+card.file;img.style.display='block';icon.style.display='none';}
    else{img.style.display='none';icon.textContent=ICONS[card.rarity]||'💎';icon.style.display='block';}
    img.style.boxShadow='0 0 40px rgba(74,158,255,.8),0 0 80px rgba(74,158,255,.4)';

    const rar=document.getElementById('reveal-rarity-text');
    rar.textContent='R A R E';rar.style.color='var(--R)';
    document.getElementById('reveal-name-text').textContent=card.name;

    // R演出：光柱が縦に走る
    await wait(300);
    document.getElementById('light-beam-R').classList.add('active');
    await wait(500);
    document.getElementById('light-cross').classList.add('active');
    await wait(300);

    // カード登場
    const area=document.getElementById('reveal-card-area');
    area.classList.add('show-card');
    await wait(100);
    rar.classList.add('show-text');
    document.getElementById('reveal-name-text').classList.add('show-text');
    document.getElementById('reveal-tap-hint').classList.add('show-text');
  });
}

async function showRevealSR(card){
  return new Promise(async resolve=>{
    revealResolve=resolve;
    resetBeams();
    const stage=document.getElementById('reveal-stage');
    stage.classList.add('show');

    const img=document.getElementById('reveal-img');
    const icon=document.getElementById('reveal-icon-big');
    if(card.file){img.src=IMG+card.file;img.style.display='block';icon.style.display='none';}
    else{img.style.display='none';icon.textContent=ICONS[card.rarity]||'⭐';icon.style.display='block';}
    img.style.boxShadow='0 0 60px rgba(192,96,255,.9),0 0 120px rgba(212,168,67,.5)';

    const rar=document.getElementById('reveal-rarity-text');
    rar.textContent='SUPER RARE';rar.style.color='var(--SR)';
    document.getElementById('reveal-name-text').textContent=card.name;

    // SR演出：オーラ→複数光柱→カード降臨
    await wait(200);
    document.getElementById('sr-aura').classList.add('active');
    await wait(300);

    // 光柱を時差で
    ['srb1','srb2','srb3','srb4'].forEach((id,i)=>{
      setTimeout(()=>{
        const b=document.getElementById(id);
        b.classList.add('active');
      },i*120);
    });

    await wait(800);
    spawnParticles('#c060ff',15,true);
    spawnParticles('#d4a843',15,true);

    const area=document.getElementById('reveal-card-area');
    area.classList.add('show-card');
    await wait(100);
    rar.classList.add('show-text');
    document.getElementById('reveal-name-text').classList.add('show-text');
    document.getElementById('reveal-tap-hint').classList.add('show-text');
  });
}

async function showRevealNHN(card){
  return new Promise(async resolve=>{
    revealResolve=resolve;
    resetBeams();
    const stage=document.getElementById('reveal-stage');
    stage.classList.add('show');

    const img=document.getElementById('reveal-img');
    const icon=document.getElementById('reveal-icon-big');
    if(card.file){img.src=IMG+card.file;img.style.display='block';icon.style.display='none';}
    else{img.style.display='none';icon.textContent=ICONS[card.rarity]||'🌸';icon.style.display='block';}
    img.style.boxShadow='none';

    const rar=document.getElementById('reveal-rarity-text');
    rar.textContent=card.rarity;
    rar.style.color=card.rarity==='HN'?'var(--HN)':'var(--N)';
    document.getElementById('reveal-name-text').textContent=card.name;

    await wait(100);
    const area=document.getElementById('reveal-card-area');
    area.classList.add('show-card');
    rar.classList.add('show-text');
    document.getElementById('reveal-name-text').classList.add('show-text');
    document.getElementById('reveal-tap-hint').classList.add('show-text');
  });
}

function resolveReveal(){
  document.getElementById('reveal-stage').classList.remove('show');
  if(revealResolve){revealResolve();revealResolve=null;}
}

// ===== GACHA =====
function rollRarity(){const r=Math.random();let a=0;for(const{rarity,rate}of RATES){a+=rate;if(r<a)return rarity;}return 'N';}
function pickCard(r){const p=CARDS.filter(c=>c.rarity===r);return p[Math.floor(Math.random()*p.length)];}

function addCardToGrid(card){
  const g=document.getElementById('result-grid');
  const el=document.createElement('div');
  el.className=`card rarity-${card.rarity}`;
  if(card.file){
    el.innerHTML=`<img src="${IMG}${card.file}" alt="${card.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="card-no-image" style="display:none"><div class="card-rarity-tag c-${card.rarity}">${card.rarity}</div><div class="card-icon">${ICONS[card.rarity]||'🃏'}</div></div>
      <div class="card-label"><div class="card-rarity-tag c-${card.rarity}">${card.rarity}</div><div class="card-name-text">${card.name}</div></div>`;
  } else {
    el.innerHTML=`<div class="card-no-image"><div class="card-rarity-tag c-${card.rarity}">${card.rarity}</div><div class="card-icon">${ICONS[card.rarity]||'🃏'}</div><div style="font-size:.75rem;margin-top:6px;font-weight:700">${card.name}</div></div>`;
  }
  g.appendChild(el);
  setTimeout(()=>el.classList.add('visible'),20);
}

async function doGacha(n){
  document.getElementById('btn1').disabled=true;
  document.getElementById('btn5').disabled=true;
  document.getElementById('result-grid').innerHTML='';

  const results=[];
  for(let i=0;i<n;i++){
    const r=rollRarity();const c=pickCard(r);results.push(c);
    stats[r]=(stats[r]||0)+1;stats.total++;
    if(RARE_RARITIES.has(r)){const e=history.find(h=>h.id===c.id);if(e)e.count++;else history.unshift({...c,count:1});}
  }

  for(const card of results){
    if(card.rarity==='SR'){
      playSR();
      spawnParticles('#c060ff',20,true);
      spawnParticles('#d4a843',10,true);
      await showRevealSR(card);
    } else if(card.rarity==='R'){
      playR();
      spawnParticles('#4a9eff',10,false);
      await showRevealR(card);
    } else if(card.rarity==='HN'){
      playHN();
      await showRevealNHN(card);
    } else {
      playN();
      await showRevealNHN(card);
    }
    addCardToGrid(card);
  }

  renderStats();renderHistory();
  document.getElementById('btn1').disabled=false;
  document.getElementById('btn5').disabled=false;
}

function renderStats(){
  const w=document.getElementById('stats-rows');const t=stats.total||1;
  w.innerHTML=['SR','R','HN','N'].map(r=>{
    const p=Math.round((stats[r]||0)/t*100);
    return `<div class="stat-row"><div class="stat-label c-${r}">${r}</div><div class="stat-bar-wrap"><div class="stat-bar bar-${r}" style="width:${p}%"></div></div><div class="stat-count">${stats[r]||0}</div></div>`;
  }).join('');
  document.getElementById('total-count').textContent=stats.total;
}

function renderHistory(){
  const w=document.getElementById('rare-history');
  if(!history.length){w.innerHTML='';return;}
  w.innerHTML=history.map(h=>`<span class="hist-chip c-${h.rarity}" style="border-color:var(--${h.rarity})">${h.name}${h.count>1?` ×${h.count}`:''}</span>`).join('');
}

function toggleRate(){
  const t=document.getElementById('rate-table');t.classList.toggle('show');
  document.getElementById('rate-toggle').textContent=t.classList.contains('show')?'▴ 排出率を閉じる':'▾ 排出率を確認する';
}

function resetAll(){
  stats={N:0,HN:0,R:0,SR:0,total:0};history=[];
  document.getElementById('result-grid').innerHTML='';
  document.getElementById('rare-history').innerHTML='';
  renderStats();
}

renderStats();
</script>
